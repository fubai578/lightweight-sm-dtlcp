name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建
        run: bash scripts/build.sh

      - name: 基点预计算表与生成器一致性
        run: bash scripts/gen_fixed_base.sh --check

      - name: 全量测试（KAT + 差分指纹 + 协议端到端 + 攻击负向）
        run: |
          bash scripts/run_tests.sh | tee /tmp/test.log
          # 断言：7 个算法变体 + 默认/MCU 两档 DTLCP，共 9 行 "失败 0"
          n=$(grep -c "失败 0" /tmp/test.log)
          echo "通过项：$n / 9"
          [ "$n" -eq 9 ]
          # 断言：7 个变体差分指纹逐位一致
          fps=$(grep "FINGERPRINT" /tmp/test.log | awk '{print $2}' | sort -u | wc -l)
          echo "指纹种类：$fps（应为 1）"
          [ "$fps" -eq 1 ]

      - name: 板级代码预检（宿主仿真 + 语法检查 + 32K 链接证明）
        run: bash scripts/check_embedded.sh

      - name: 性能基准
        run: bash scripts/benchmark.sh

      - name: 侧信道执行路径实验（操作计数，通用 + 基点两条路径）
        run: |
          ./bin/bench_sct_opt | tee /tmp/sct0.log
          ./bin/bench_sct_ct  | tee /tmp/sct1.log
          # CT=0 应为"随秘密变化"，CT=1 应为"恒定"；两条路径各一行判定
          [ "$(grep -c '随秘密变化' /tmp/sct0.log)" -eq 2 ]
          [ "$(grep -c '恒定' /tmp/sct1.log)" -eq 2 ]

      - name: 大样本恒定性门禁（4096 个标量的运算次数极差）
        run: |
          # 退出码即断言：CT 构建下两条路径必须完全恒定（极差 0）；
          # 变时间构建下通用路径必须随秘密变化（否则变时间性质丢失，需排查）
          ./bin/bench_sct_ct  --sweep 4096 | tail -6
          ./bin/bench_sct_opt --sweep 4096 | tail -6

      - name: 常量时间代价（交错测量，工件）
        run: bash scripts/ct_cost.sh 3

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            bin/bench_results.md
            bin/size_report.md
            bin/ct_cost.md

  windows:
    name: Windows (MinGW / Git Bash)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: 构建
        run: bash scripts/build.sh

      - name: 全量测试
        run: |
          bash scripts/run_tests.sh | tee /tmp/test.log
          n=$(grep -c "失败 0" /tmp/test.log)
          echo "通过项：$n / 9"
          [ "$n" -eq 9 ]
          fps=$(grep "FINGERPRINT" /tmp/test.log | awk '{print $2}' | sort -u | wc -l)
          echo "指纹种类：$fps（应为 1）"
          [ "$fps" -eq 1 ]
